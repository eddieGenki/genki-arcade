<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- PWA icons. /favicon.png is the 2925-square original; the /icons/*
         PNGs are downscaled variants generated from it at build prep time.
         Browsers / iOS Safari pick the closest size match automatically. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Latin: Onest (display) + Inter (body) — fallbacks for Nekst +
         Suisse Int'l per design spec.
         CJK: Noto Sans JP / KR / SC / TC as fallback fonts. Loaded with
         a limited weight range (400 + 700) to keep the payload
         reasonable — heavier weights would triple the font download.
         Fonts are loaded via a single request so the browser can HTTP/2
         multiplex them.
         `display=swap` shows the fallback system font until each web
         font arrives, avoiding a blank flash. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>Genki Arcade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
